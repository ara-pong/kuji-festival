<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101027">
<title>おまつり抽選所</title>
<style>
:root{--ink:#17152c;--muted:#aaa8c4;--gold:#ffd875;--pink:#ff769d;--panel:#201e3c;--line:#ffffff1c}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#494078 0,#211e42 37%,#101027 78%);color:#fff;font-family:'Zen Maru Gothic','Yu Gothic',sans-serif;overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer} .wrap{max-width:1180px;margin:auto;padding:22px 32px 30px}
header{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:13px}.logo{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#ffdf83,#f4a93f);color:#54321e;font-size:25px;box-shadow:0 5px 20px #ffb44852}.brand-name{font-size:19px;font-weight:900;letter-spacing:.07em}.brand-sub{font-size:10px;color:#aaa8c4;letter-spacing:.24em}.head-actions{display:flex;gap:9px}.pill{border:1px solid var(--line);border-radius:30px;background:#ffffff0c;color:#efedf9;padding:9px 15px;font-size:12px}.pill:hover{background:#ffffff19}.pill .icon{margin-right:5px}
.hero{text-align:center;padding:18px 0 9px}.festival{font-size:11px;letter-spacing:.33em;color:var(--gold);font-weight:700}.hero h1{margin:6px 0 0;font-size:clamp(27px,4vw,43px);letter-spacing:.07em;font-weight:900}.hero p{margin:6px 0;color:#bbb9d0;font-size:13px}
.stage{max-width:940px;margin:18px auto 20px;background:linear-gradient(140deg,#2e2b51,#211e3c 70%);border:1px solid #ffffff1e;border-radius:30px;padding:22px 30px 25px;position:relative;overflow:hidden;box-shadow:0 24px 70px #05051277}.stage:before,.stage:after{content:'✦';position:absolute;color:#ffd87534;font-size:60px}.stage:before{top:13px;left:25px}.stage:after{right:28px;bottom:18px}
.stage-head{display:flex;align-items:center;justify-content:center;gap:11px;color:#d9d5ed;font-size:12px;letter-spacing:.18em}.live{width:7px;height:7px;background:#80e0b2;border-radius:50%;box-shadow:0 0 10px #80e0b2}.ball{height:168px;width:168px;margin:12px auto 10px;border-radius:50%;position:relative;background:radial-gradient(circle at 36% 27%,#fff1bf 0,#ffc45e 18%,#e47a3d 60%,#913d48 100%);border:8px solid #fbd98b;box-shadow:0 0 0 5px #8d654b,0 0 42px #ffa44760,inset -12px -16px 24px #4b23478a;display:grid;place-items:center;transition:transform .25s}.ball:before,.ball:after{content:'';position:absolute;width:122px;height:122px;border:2px dotted #fff8;border-radius:50%}.ball:after{transform:rotateX(65deg)}.ball span{z-index:1;color:#542c37;text-align:center;font-size:18px;font-weight:900;line-height:1.35;text-shadow:0 1px #fff8}.ball span b{font-size:28px}.ball.spinning{animation:spin .34s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.draw-btn{display:block;margin:0 auto;border:0;border-radius:17px;padding:15px 56px;background:linear-gradient(180deg,#ffe496,#ffbd56);color:#4a2a33;font-weight:900;font-size:19px;letter-spacing:.11em;box-shadow:0 6px 0 #b96b42,0 12px 28px #f4a94730;transition:transform .12s}.draw-btn:hover{transform:translateY(-2px)}.draw-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b96b42}.draw-btn:disabled{opacity:.55;cursor:wait}.hint{text-align:center;color:#aaa7c1;font-size:10px;margin-top:12px}
.prizes{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;max-width:940px;margin:auto}.prize{border-radius:19px;background:linear-gradient(140deg,#262442,#1c1b35);border:1px solid var(--line);padding:16px 17px 13px;position:relative;min-height:113px;transition:.2s}.prize:hover{transform:translateY(-2px);border-color:#ffffff44}.prize-top{display:flex;justify-content:space-between;align-items:center}.medal{font-size:11px;font-weight:900;letter-spacing:.12em;border-radius:7px;padding:4px 8px}.prize.a .medal{background:#f5c84c;color:#493413}.prize.b .medal{background:#d7d5ec;color:#39344f}.prize.c .medal{background:#d49362;color:#44271f}.prize.d .medal{background:#aaa4df;color:#282544}.stock{font-size:10px;color:#bbb8d0}.stock strong{font-size:17px;color:#fff;margin-right:3px}.prize-name{font-size:16px;font-weight:900;margin-top:12px}.prize-note{font-size:10px;color:#aaa8c4;margin-top:1px}.prize.empty{opacity:.42;filter:grayscale(1)}.prize.empty:after{content:'終了';position:absolute;right:16px;bottom:13px;font-size:10px;color:#c3bfd4}
footer{max-width:940px;margin:20px auto 0;padding-top:13px;border-top:1px solid #ffffff13;display:flex;align-items:center;justify-content:space-between;color:#9996b3;font-size:10px}.secure{color:#9bd6bb}.toaster{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:#292744;border:1px solid #ffffff28;padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px #0008;font-size:13px;transition:.25s;pointer-events:none;z-index:8}.toaster.show{opacity:1;transform:translate(-50%,0)}
.modal-back{position:fixed;inset:0;background:#090918c9;backdrop-filter:blur(7px);display:none;place-items:center;padding:18px;z-index:4}.modal-back.open{display:grid}.modal{width:min(510px,100%);border:1px solid #ffffff24;border-radius:24px;background:#23213f;padding:24px;box-shadow:0 25px 90px #0009}.modal h2{margin:0 0 5px;font-size:21px}.modal-desc{font-size:12px;color:#aaa8c4;margin:0 0 19px}.settings-row{display:grid;grid-template-columns:1.3fr .8fr 1fr;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff12}.settings-row.head{color:#9996b3;font-size:10px}.settings-row label{font-size:13px;font-weight:700}.settings-row input{width:100%;padding:9px 10px;background:#15142b;border:1px solid #ffffff20;border-radius:9px;color:white}.settings-row .settings-code{font-size:11px;color:#c2bed6}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}.btn{padding:10px 15px;border-radius:10px;border:1px solid #ffffff24;color:white;background:#ffffff0d;font-size:12px}.btn.primary{background:var(--gold);border:0;color:#473022;font-weight:900}.btn.danger{color:#ff9cac;border-color:#ff839244;margin-right:auto}
.result-back{position:fixed;inset:0;background:#080817de;backdrop-filter:blur(9px);display:none;place-items:center;z-index:6;padding:20px}.result-back.open{display:grid}.result{position:relative;text-align:center;width:min(520px,100%);padding:38px 25px 30px;border-radius:30px;background:linear-gradient(145deg,#3a3157,#211d3c);border:1px solid #fff4;box-shadow:0 0 80px #ffca5c40;animation:pop .4s cubic-bezier(.2,1.5,.5,1)}@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}.result .spark{font-size:34px;color:var(--gold)}.result .label{font-size:12px;letter-spacing:.3em;color:#cac5dd;margin:10px}.result h2{font-size:45px;margin:4px 0;color:var(--gold);font-weight:900;text-shadow:0 4px 22px #f8ba5e54}.result p{color:#d7d3e6;font-size:14px;margin:6px}.result button{margin-top:22px;padding:12px 35px;border:0;border-radius:12px;background:#fff;color:#292440;font-weight:900}.result.big{background:radial-gradient(ellipse at top,#664767,#282142 60%);box-shadow:0 0 110px #ffd15c77}.result.big h2{font-size:64px;color:#ffe179}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:7}.confetti i{position:absolute;top:-15px;width:9px;height:15px;animation:fall 2.7s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(900deg)}}
.history-back{position:fixed;inset:0;background:#090918c9;backdrop-filter:blur(7px);display:none;place-items:center;padding:18px;z-index:5}.history-back.open{display:grid}.history{width:min(500px,100%);max-height:80vh;overflow:auto;border:1px solid #ffffff24;border-radius:24px;background:#23213f;padding:23px}.history-head{display:flex;justify-content:space-between;align-items:center}.history h2{margin:0;font-size:19px}.history-list{margin-top:13px}.history-entry{display:flex;justify-content:space-between;border-top:1px solid #fff1;padding:11px 0;font-size:12px}.history-entry b{color:var(--gold)}.empty-history{text-align:center;color:#a9a5c2;padding:28px 0;font-size:12px}
@media(max-width:680px){.wrap{padding:13px 14px 24px}header{height:58px}.brand-name{font-size:16px}.pill{padding:8px 10px}.hero{padding-top:19px}.stage{padding:19px 15px 20px;border-radius:23px}.ball{width:144px;height:144px}.ball:before,.ball:after{width:104px;height:104px}.draw-btn{width:100%;max-width:320px}.prizes{grid-template-columns:repeat(2,1fr);gap:9px}.prize{padding:13px;min-height:105px}.prize-name{font-size:14px}footer{margin-top:16px}.settings-row{grid-template-columns:.9fr .8fr 1fr;gap:6px}.modal{padding:20px}}
.ball.spinning{animation:spin .32s linear infinite,glow .7s ease-in-out infinite alternate}.stage.drawing{animation:stagePulse .7s ease-in-out infinite alternate}.stage.drawing .stage-head{color:#ffe49a}.stage.drawing .live{background:#ffdf73;box-shadow:0 0 16px #ffd34f;animation:blink .3s infinite alternate}@keyframes spin{to{transform:rotate(360deg) scale(1.045)}}@keyframes glow{to{box-shadow:0 0 0 7px #bd8156,0 0 70px #ffbd49,inset -12px -16px 24px #4b23478a}}@keyframes stagePulse{to{box-shadow:0 24px 80px #05051277,0 0 42px #ffcf5d33}}@keyframes blink{to{opacity:.35}}
.result-back.jackpot{background:radial-gradient(ellipse at center,#ffca5852 0,#140e28e8 68%);animation:goldFlash .65s ease-out}.result-back.jackpot:before{content:'✦　　✧　　✦　　✧　　✦';position:absolute;inset:0;display:grid;place-items:center;color:#ffe88a99;font-size:clamp(35px,9vw,100px);letter-spacing:.15em;animation:burst .9s ease-out both;pointer-events:none}.result.big{border:2px solid #fff0a6;background:radial-gradient(ellipse at 50% 0,#ffdb74,#a54d5e 45%,#302047 88%);box-shadow:0 0 25px #ffe57e,0 0 90px #ffca5caa,inset 0 0 40px #ffefa933;animation:jackpotPop .75s cubic-bezier(.16,1.5,.35,1) both}.result.big .spark{font-size:50px;color:#fff1a0;text-shadow:0 0 20px #ffd34f;animation:sparkle .55s ease-in-out infinite alternate}.result.big h2{font-size:clamp(64px,12vw,88px);color:#fff1a0;text-shadow:0 0 10px #fff,0 0 28px #ffd34f,0 5px 0 #a44950;animation:shine .8s ease-in-out infinite alternate}.result.big .jackpot-label{display:block}.jackpot-label{display:none;color:#fff4bb;background:linear-gradient(90deg,#8f313e,#c88136,#8f313e);border:1px solid #ffefad;border-radius:30px;padding:7px 20px;font-size:14px;font-weight:900;letter-spacing:.2em;width:max-content;margin:0 auto;box-shadow:0 0 24px #ffd34f}.result.big p{font-size:17px;color:#fff3cc}.result.big button{background:linear-gradient(#fff2b8,#ffc955);box-shadow:0 0 20px #ffd34f;font-weight:900}@keyframes jackpotPop{0%{transform:scale(.25) rotate(-9deg);filter:brightness(3)}55%{transform:scale(1.12) rotate(2deg)}100%{transform:scale(1) rotate(0);filter:brightness(1)}}@keyframes goldFlash{0%{background:#fff5b8}100%{background:radial-gradient(ellipse at center,#ffca5852 0,#140e28e8 68%)}}@keyframes burst{0%{transform:scale(.15) rotate(-25deg);opacity:0}45%{opacity:1}100%{transform:scale(1.15) rotate(8deg);opacity:.5}}@keyframes sparkle{to{transform:scale(1.22) rotate(9deg)}}@keyframes shine{to{filter:brightness(1.35)}}
</style>
</head>
<body>
<div class="wrap">
 <header><div class="brand"><div class="logo">✦</div><div><div class="brand-name">おまつり抽選所</div><div class="brand-sub">SYSTEM FESTIVAL · LOTTERY</div></div></div><div class="head-actions"><button class="pill" id="historyBtn"><span class="icon">☷</span>履歴</button><button class="pill" id="settingsBtn"><span class="icon">⚙</span>設定</button></div></header>
 <section class="hero"><div class="festival">学園祭 · システム科</div><h1>運だめし、いってみよう！</h1><p>ボタンを押して、今日のラッキーを引き当てよう。</p></section>
 <section class="stage"><div class="stage-head"><span class="live"></span>抽選の準備ができています</div><div class="ball" id="ball"><span>LUCKY<br><b>?</b></span></div><button class="draw-btn" id="drawBtn">くじを引く！</button><div class="hint">抽選結果はこの端末に保存されます</div></section>
 <section class="prizes" id="prizes"></section>
 <footer><span>今日の挑戦 <b id="drawCount">0</b> 回</span><span id="dayLabel"></span></footer>
</div>
<div class="toaster" id="toast"></div><div class="confetti" id="confetti"></div>
<div class="modal-back" id="settingsModal"><div class="modal"><h2>抽選の設定</h2><p class="modal-desc">賞品名と残数を調整できます。変更はこの端末に保存されます。</p><div class="settings-row head"><span>賞</span><span>残数</span><span>賞品名</span></div><div id="settingsRows"></div><div class="modal-actions"><button class="btn danger" id="resetBtn">今日の抽選をリセット</button><button class="btn" id="cancelSettings">閉じる</button><button class="btn primary" id="saveSettings">保存する</button></div></div></div>
<div class="result-back" id="resultModal"><div class="result" id="resultCard"><div class="spark">✦　✧　✦</div><div class="jackpot-label">★　超大当たり　★</div><div class="label">抽選結果</div><h2 id="resultTitle">A賞！</h2><p id="resultMessage">おめでとうございます！</p><button id="closeResult">とじる</button></div></div>
<div class="history-back" id="historyModal"><div class="history"><div class="history-head"><h2>今日の抽選履歴</h2><button class="btn" id="closeHistory">閉じる</button></div><div class="history-list" id="historyList"></div></div></div>
<script>
(()=>{
const KEY='omatsuri-kuji-v1';
const initial=()=>({date:new Date().toLocaleDateString('ja-JP'),draws:0,prizes:[{id:'A',name:'A賞',note:'ポテト唐揚げセット',total:3,remaining:3},{id:'B',name:'B賞',note:'ポテト唐揚げ',total:8,remaining:8},{id:'C',name:'C賞',note:'おかわり券',total:18,remaining:18},{id:'D',name:'D賞',note:'トッピング券',total:35,remaining:35}],history:[]});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch{state=initial()}
// A new calendar day starts fresh. Settings (names and starting counts) carry over.
if(state.date!==new Date().toLocaleDateString('ja-JP')){state.date=new Date().toLocaleDateString('ja-JP');state.draws=0;state.prizes.forEach(p=>p.remaining=p.total);state.history=[];persist()}
const $=id=>document.getElementById(id);function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){ $('prizes').innerHTML=state.prizes.map(p=>`<article class="prize ${p.id.toLowerCase()} ${p.remaining===0?'empty':''}"><div class="prize-top"><span class="medal">${escapeHtml(p.id)} 賞</span>${p.remaining>0?`<span class="stock"><strong>${p.remaining}</strong>個</span>`:''}</div><div class="prize-name">${escapeHtml(p.name)}</div><div class="prize-note">${escapeHtml(p.note||'')}</div></article>`).join('');$('drawCount').textContent=state.draws;$('dayLabel').textContent=state.date}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function fanfare(rare=false){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),now=ctx.currentTime,notes=rare?[523,659,784,1047,1319]:[523,659,784,988];notes.forEach((f,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=f;gain.gain.setValueAtTime(.0001,now+i*.13);gain.gain.exponentialRampToValueAtTime(rare?.12:.075,now+i*.13+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.13+.24);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+i*.13);osc.stop(now+i*.13+.25)});setTimeout(()=>ctx.close(),1600)}catch{}}
function confetti(amount=85,rare=false){const box=$('confetti');box.innerHTML='';const colors=rare?['#fff2a3','#ffd23f','#ffab38','#fff','#ff6d70']:['#ffd875','#ff769d','#85ddc3','#a69aff','#fff'];for(let i=0;i<amount;i++){const el=document.createElement('i');el.style.left=Math.random()*100+'%';el.style.background=colors[i%colors.length];el.style.animationDelay=Math.random()*.6+'s';el.style.transform=`rotate(${Math.random()*180}deg)`;box.append(el)}setTimeout(()=>box.innerHTML='',3600)}
function draw(){if($('drawBtn').disabled)return;const prizes=state.prizes.filter(p=>p.remaining>0);const prizeTotal=prizes.reduce((sum,p)=>sum+p.remaining,0);if(!prizeTotal){toast('賞品がすべてなくなりました');return}$('drawBtn').disabled=true;$('drawBtn').textContent='運命のくじを抽選中…';document.querySelector('.stage').classList.add('drawing');$('ball').classList.add('spinning');fanfare(false);let n=0;const timer=setInterval(()=>{n++;$('ball').style.transform=`rotate(${n%2?12:-12}deg)`},100);setTimeout(()=>{clearInterval(timer);$('ball').classList.remove('spinning');$('ball').style.transform='';document.querySelector('.stage').classList.remove('drawing');let pick=Math.random()*prizeTotal;let win=null;for(const p of prizes){pick-=p.remaining;if(pick<0){win=p;break}}win.remaining--;state.draws++;const result={label:win.id+'賞',name:win.name,win:true};state.history.unshift({time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),...result});state.history=state.history.slice(0,100);persist();render();showResult(result);$('drawBtn').textContent='くじを引く！';$('drawBtn').disabled=false},2400)}
function showResult(r){const rare=r.label==='A賞';$('resultTitle').textContent=rare?'A賞':r.label;$('resultMessage').textContent='おめでとうございます！ '+r.name;$('resultCard').classList.toggle('big',rare);$('resultModal').classList.toggle('jackpot',rare);$('resultModal').classList.add('open');confetti(rare?220:55,rare);fanfare(rare)}
function closeResult(){$('resultModal').classList.remove('open')}
function openSettings(){ $('settingsRows').innerHTML=state.prizes.map((p,i)=>`<div class="settings-row"><label>${escapeHtml(p.id)} 賞</label><input type="number" min="0" max="9999" value="${p.total}" data-total="${i}" aria-label="${p.id}賞の総数"><input type="text" maxlength="24" value="${escapeHtml(p.name)}" data-name="${i}" aria-label="${p.id}賞の商品名"></div>`).join('');$('settingsModal').classList.add('open')}
function closeSettings(){$('settingsModal').classList.remove('open')}
function saveSettings(){for(let i=0;i<state.prizes.length;i++){const p=state.prizes[i],newTotal=Math.max(0,Math.min(9999,parseInt(document.querySelector(`[data-total="${i}"]`).value,10)||0)),oldTotal=p.total,used=oldTotal-p.remaining;p.total=newTotal;p.remaining=Math.max(0,newTotal-used);p.name=document.querySelector(`[data-name="${i}"]`).value.trim()||p.id+'賞'}persist();render();closeSettings();toast('設定を保存しました')}
function reset(){if(!confirm('今日の抽選回数と履歴を消し、賞品を最初の数に戻しますか？'))return;state.draws=0;state.history=[];state.prizes.forEach(p=>p.remaining=p.total);persist();render();closeSettings();toast('今日の抽選をリセットしました')}
function openHistory(){$('historyList').innerHTML=state.history.length?state.history.map((h,i)=>`<div class="history-entry"><span>${String(state.draws-i).padStart(2,'0')}回目 · ${h.time}</span><b>${escapeHtml(h.label)}</b></div>`).join(''):'<div class="empty-history">まだ抽選履歴はありません</div>';$('historyModal').classList.add('open')}
$('drawBtn').addEventListener('click',draw);$('settingsBtn').addEventListener('click',openSettings);$('cancelSettings').addEventListener('click',closeSettings);$('saveSettings').addEventListener('click',saveSettings);$('resetBtn').addEventListener('click',reset);$('historyBtn').addEventListener('click',openHistory);$('closeHistory').addEventListener('click',()=>$('historyModal').classList.remove('open'));$('closeResult').addEventListener('click',closeResult);$('resultModal').addEventListener('click',e=>{if(e.target===$('resultModal'))closeResult()});$('settingsModal').addEventListener('click',e=>{if(e.target===$('settingsModal'))closeSettings()});render();
})();
</script>
</body></html>
